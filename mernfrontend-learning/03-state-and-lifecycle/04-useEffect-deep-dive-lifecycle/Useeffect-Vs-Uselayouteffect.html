/* toggle */

.switch{
  width:46px;
  height:26px;
  border-radius:999px;
  background:#334155;
  position:relative;
  transition:.2s;
  flex:none;
  cursor:pointer;
  border:1px solid #475569;
}

.switch:after{
  content:'';
  position:absolute;
  top:2px;
  left:2px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#cbd5e1;
  transition:.2s;
}

.switch[data-on="true"]{
  background:#0ea5e9;
  border-color:#0ea5e9;
}

.switch[data-on="true"]:after{
  left:22px;
  background:white;
}

@keyframes flashPulse{
  0%{
    opacity:.95
  }

  100%{
    opacity:0
  }
}

.flash-overlay{
  animation: flashPulse .65s ease-out forwards;
}

@keyframes popIn{
  from{
    opacity:0;
    transform:translateY(4px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.pop{
  animation: popIn .25s ease-out;
}

@keyframes blinkDot{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.blink{
  animation: blinkDot 1s infinite;
}

@keyframes scanline{
  0%{
    left:-30%
  }

  100%{
    left:110%
  }
}

.scan{
  animation: scanline 1.1s linear infinite;
}

@keyframes shakeX{
  0%,100%{

  }

  25%{

  }

  75%{
    transform:translateX(3px)

.shake{
